[workspace]
members = [
    "crates/meteordb",
    "crates/meteordb-bench-support",
    "crates/meteordb-cli",
    "crates/meteordb-rocks-bench",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
blake3 = { version = "1.8.2", features = ["pure"] }
crc32c = "0.6.8"
fs2 = "0.4.3"
libc = "0.2.174"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
snap = "1.1.1"
thiserror = "2.0.12"
