[package]
name = "meteordb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Inspection and diagnostic CLI for MeteorDB"
publish = false

[[bin]]
name = "meteordb"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
hdrhistogram = "7.5.4"
meteordb = { path = "../meteordb" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
