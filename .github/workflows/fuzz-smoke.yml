name: Scheduled fuzz smoke

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - wal_decode
          - block_decode
          - manifest_decode
          - composite_key_decode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.12.0 --locked
      - name: Run bounded fuzz smoke
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run "${{ matrix.target }}" --
          -max_len=65536
          -runs=10000
          -max_total_time=15
